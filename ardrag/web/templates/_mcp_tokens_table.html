{% if not tokens %}
<tr><td class="muted">No API tokens yet.</td></tr>
{% else %}
{% for t in tokens %}
<tr>
  <td>{{ t.label }}</td>
  <td class="muted">{{ t.created_at.strftime('%m/%d/%Y') }}</td>
  <td><button class="secondary remove-mcp-token-btn" data-id="{{ t.id }}" type="button">Revoke</button></td>
</tr>
{% endfor %}
{% endif %}
