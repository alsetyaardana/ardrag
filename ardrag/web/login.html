<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ArdRAG — Login</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230058bc'/%3E%3Cpath d='M9 7h9l5 5v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z' fill='white'/%3E%3Cpath d='M18 7v5h5' fill='none' stroke='%230058bc' stroke-width='1.4'/%3E%3Cline x1='11' y1='16.5' x2='19' y2='16.5' stroke='%230058bc' stroke-width='1.3'/%3E%3Cline x1='11' y1='19.5' x2='19' y2='19.5' stroke='%230058bc' stroke-width='1.3'/%3E%3Cline x1='11' y1='22.5' x2='16' y2='22.5' stroke='%230058bc' stroke-width='1.3'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Always light — matches the Azure Clarity reference (white/blue). The main app (index.html)
     offers a manual dark toggle; this single-purpose login screen stays light for consistency
     with the first thing a visitor sees, regardless of OS preference. */
  :root {
    color-scheme: light;
    --accent: #0058bc;
    --accent-hover: #00459a;
    --accent-soft: #e7eeff;
    --bg: #f9f9ff;
    --surface: #ffffff;
    --border: #d8e3fb;
    --text: #111c2d;
    --text-muted: #62697a;
    --danger: #ba1a1a;
    --danger-soft: #ffdad6;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Hanken Grotesk", -apple-system, "Segoe UI", system-ui, sans-serif; margin: 0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: var(--bg); color: var(--text); padding: 20px; gap: 18px;
  }
  .card {
    width: min(360px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 36px 32px; box-shadow: 0 4px 24px rgba(15,23,42,0.06); text-align: center;
  }
  @media (max-width: 400px) {
    .card { padding: 26px 22px; }
  }
  /* iOS Safari auto-zooms on focus if an input's font-size is under 16px */
  @media (max-width: 480px) {
    input { font-size: 16px; }
  }
  .logo {
    width: 52px; height: 52px; border-radius: 14px; overflow: hidden; background: var(--accent-soft);
    display: flex; align-items: center; justify-content: center; margin: 0 auto 18px;
  }
  .logo svg { width: 30px; height: 30px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; font-weight: 700; letter-spacing: -0.01em; }
  .subtitle { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 24px; }
  form { text-align: left; }
  label {
    display: block; font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
    color: var(--text-muted); margin-bottom: 6px; margin-top: 16px;
  }
  input {
    width: 100%; padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 0.92rem; background: var(--bg); color: var(--text); font-family: inherit;
  }
  input:focus {
    outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft);
  }
  button {
    width: 100%; margin-top: 24px; padding: 12px; border: none; border-radius: 8px;
    background: var(--accent); color: white; font-weight: 700; font-size: 0.92rem; cursor: pointer;
    font-family: inherit; transition: background 0.15s;
  }
  button:hover { background: var(--accent-hover); }
  .error {
    margin-top: 14px; padding: 9px 12px; border-radius: 8px; font-size: 0.82rem;
    background: var(--danger-soft); color: var(--danger); display: none;
  }
  .error.show { display: block; }
  .status-badges {
    display: flex; align-items: center; gap: 10px; font-size: 0.76rem; color: var(--text-muted);
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 7px 16px;
  }
  .status-badges .dot { width: 7px; height: 7px; border-radius: 50%; background: #16a34a; flex-shrink: 0; }
  .status-badges .sep { width: 1px; height: 12px; background: var(--border); }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#0058bc"/>
        <path d="M9 7h9l5 5v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="white"/>
        <path d="M18 7v5h5" fill="none" stroke="#0058bc" stroke-width="1.4"/>
        <line x1="11" y1="16.5" x2="19" y2="16.5" stroke="#0058bc" stroke-width="1.3"/>
        <line x1="11" y1="19.5" x2="19" y2="19.5" stroke="#0058bc" stroke-width="1.3"/>
        <line x1="11" y1="22.5" x2="16" y2="22.5" stroke="#0058bc" stroke-width="1.3"/>
      </svg>
    </div>
    <h1>ArdRAG</h1>
    <p class="subtitle">Personal RAG document manager</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <div class="error" id="error-box">Invalid username or password.</div>
      <button type="submit">Masuk</button>
    </form>
  </div>
  <div class="status-badges">
    <span class="dot"></span> System Online
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      const fd = new FormData(form);
      const res = await fetch('/login', { method: 'POST', body: fd });
      if (res.redirected || res.ok) {
        window.location.href = '/';
      } else {
        errorBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
