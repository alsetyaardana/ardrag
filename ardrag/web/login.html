<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ArdRAG — Login</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563eb'/%3E%3Cpath d='M9 7h9l5 5v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z' fill='white'/%3E%3Cpath d='M18 7v5h5' fill='none' stroke='%232563eb' stroke-width='1.4'/%3E%3Cline x1='11' y1='16.5' x2='19' y2='16.5' stroke='%232563eb' stroke-width='1.3'/%3E%3Cline x1='11' y1='19.5' x2='19' y2='19.5' stroke='%232563eb' stroke-width='1.3'/%3E%3Cline x1='11' y1='22.5' x2='16' y2='22.5' stroke='%232563eb' stroke-width='1.3'/%3E%3C/svg%3E" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    font-family: system-ui, sans-serif; margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: #f4f5fb; color: #1a1a1a; padding: 20px;
  }
  @media (prefers-color-scheme: dark) {
    body { background: #0f0f12; color: #e8e8e8; }
    .card { background: #1c1c1f !important; border-color: #2a2a2e !important; }
    input { background: #26262a !important; color: #e8e8e8 !important; border-color: #3a3a3e !important; }
  }
  .card {
    width: min(340px, 100%); background: #ffffff; border: 1px solid #ececf4; border-radius: 16px;
    padding: 32px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;
  }
  @media (max-width: 400px) {
    .card { padding: 24px; }
  }
  /* iOS Safari auto-zooms on focus if an input's font-size is under 16px */
  @media (max-width: 480px) {
    input { font-size: 16px; }
  }
  .logo {
    width: 48px; height: 48px; border-radius: 12px; overflow: hidden;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 16px;
  }
  .logo svg { width: 100%; height: 100%; }
  h1 { font-size: 1.3rem; margin: 0 0 4px; }
  .subtitle { font-size: 0.82rem; color: #888; margin: 0 0 22px; }
  form { text-align: left; }
  label { display: block; font-size: 0.82rem; margin-bottom: 6px; margin-top: 14px; }
  input {
    width: 100%; padding: 9px 12px; border: 1px solid #dcdcec; border-radius: 8px;
    font-size: 0.9rem; background: #f7f8fd;
  }
  button {
    width: 100%; margin-top: 22px; padding: 10px; border: none; border-radius: 8px;
    background: #4f46e5; color: white; font-weight: 600; font-size: 0.92rem; cursor: pointer;
  }
  button:hover { background: #433bd6; }
  .error {
    margin-top: 14px; padding: 8px 10px; border-radius: 8px; font-size: 0.82rem;
    background: #fee2e2; color: #b91c1c; display: none;
  }
  .error.show { display: block; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
        <rect width="32" height="32" rx="7" fill="#2563eb"/>
        <path d="M9 7h9l5 5v13a1 1 0 0 1-1 1H9a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="white"/>
        <path d="M18 7v5h5" fill="none" stroke="#2563eb" stroke-width="1.4"/>
        <line x1="11" y1="16.5" x2="19" y2="16.5" stroke="#2563eb" stroke-width="1.3"/>
        <line x1="11" y1="19.5" x2="19" y2="19.5" stroke="#2563eb" stroke-width="1.3"/>
        <line x1="11" y1="22.5" x2="16" y2="22.5" stroke="#2563eb" stroke-width="1.3"/>
      </svg>
    </div>
    <h1>ArdRAG</h1>
    <p class="subtitle">Personal RAG document manager</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required />
      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required />
      <div class="error" id="error-box">Invalid username or password.</div>
      <button type="submit">Masuk</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('login-form');
    const errorBox = document.getElementById('error-box');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.classList.remove('show');
      const fd = new FormData(form);
      const res = await fetch('/login', { method: 'POST', body: fd });
      if (res.redirected || res.ok) {
        window.location.href = '/';
      } else {
        errorBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
