[project]
name = "ardrag"
version = "0.1.0"
description = "Personal RAG exposed as an MCP server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "qdrant-client>=1.10.0",
    "fastembed>=0.3.0",
    "sqlmodel>=0.0.21",
    "python-multipart>=0.0.9",
    "pypdf>=4.3.0",
    "python-dotenv>=1.0.0",
    "itsdangerous>=2.2.0",
    "openai>=1.40.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ardrag"]
